# Causal relation classification — ABDUCTIVE reasoning (zero-shot with chain-of-thought)
# Dataset: namesarnav/counterbench  (binary: YES / NO)
# Method:  openrouter-causal  (registered in methods/few_shot/openrouter_based.py)
# Note:    abductive output_kind=list_dicts — the model returns JSON with reasoning_steps.
#          Requires a model that reliably follows JSON output instructions.
# Run:
#   poetry run python -m mdg.experiment_runner \
#     --config mdg/exp_configs/causal_mock_abductive.yml \
#     --output results/causal_abductive.json

dataset:
  name: causal_hf
  init_params:
    hf_location: namesarnav/counterbench
  run_params: {}

method:
  name: openrouter-causal
  init_params:
    api_key_env: OPENROUTER_API_KEY
    model: mistralai/ministral-8b-2512
  run_params:
    reasoning_type: abductive         # zero-shot chain-of-thought, returns JSON with steps
    temperature: 0.0
    max_docs: 25                     # small cap for a quick smoke test
    sleep_ms: 300
    retries: 3
    timeout_sec: 180                   # slightly longer — JSON output can take more tokens
    show_progress: true
    seed: 42
    split: test
    model_output_path: runs/causal_mock_abductive/output.jsonl

evaluators:
  - name: causal_classification
    init_params: {}
    run_params: {}
