[tool.poetry]
name = "mdg"
version = "0.1.0"
description = "Multimodal Document Graph — NLP benchmark evaluation framework"
authors = []
packages = [{include = "mdg"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core
pydantic = "^2.0"
PyYAML = "^6.0"
python-dotenv = "^1.0"

# HuggingFace
datasets = "^3.0"

# LLM / HTTP
requests = "^2.31"
jinja2 = "^3.1"

# Metrics
numpy = "^2.0"
scipy = "^1.13"

# UX
tqdm = "^4.66"
scikit-learn = "^1.9.0"
torch = "^2.14.0"
transformers = "^5.17.0"

[tool.poetry.group.scripts.dependencies]
# Only needed for the data-creation scripts
beautifulsoup4 = "^4.12"
python-dateutil = "^2.9"
nltk = "^3.8"

[tool.poetry.scripts]
mdg-run = "mdg.experiment_runner:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
